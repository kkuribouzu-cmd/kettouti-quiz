<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PART11 血糖濃度の調節と糖尿病｜確認クイズ</title><style>:root{font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;color:#182c3d;background:#f2f7fb}*{box-sizing:border-box}body{margin:0;padding:22px 12px}.wrap{max-width:740px;margin:auto}.panel{background:white;border-radius:20px;padding:26px;box-shadow:0 8px 30px #1234 12px}h1{font-size:clamp(22px,5vw,30px);margin:0 0 8px}.sub{color:#607488;font-size:14px}select,button{font:inherit}select{padding:13px;border:1px solid #b7cad8;border-radius:10px;width:100%;margin:12px 0}button{cursor:pointer;border-radius:12px;border:1px solid #c7d8e5;background:white;padding:15px;font-weight:650}button:hover{background:#eaf5ff}.primary{background:#0878ca;color:white;border:0}.primary:hover{background:#0869ae}.options{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}.opt{text-align:left;min-height:70px;overflow-wrap:anywhere}.correct{background:#e2f7eb!important;border-color:#20a060!important}.wrong{background:#ffe9e9!important;border-color:#d94b4b!important}.progress{height:9px;background:#e4edf4;border-radius:9px;overflow:hidden;margin:18px 0}.bar{height:100%;background:#158bd2;transition:width .2s}.tag{font-size:13px;color:#1270a9;font-weight:700}.question{font-size:clamp(19px,4vw,24px);line-height:1.65;font-weight:700;margin-top:18px}.feedback{padding:15px;background:#f1f6fa;border-radius:12px;margin:18px 0;font-weight:700}.explanation{font-size:15px;font-weight:400;line-height:1.8;margin:12px 0 0;color:#263e51}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.hide{display:none}.stat{font-size:34px;font-weight:800;color:#0878ca;margin:12px 0}@media(max-width:520px){.panel{padding:20px 16px}.options{grid-template-columns:1fr}.opt{min-height:58px}}</style></head><body><main class="wrap"><div class="panel"><div id="home"><h1>🧪 血糖濃度の調節と糖尿病</h1><p class="sub">PART11｜血糖濃度の調節と糖尿病を復習しよう</p><p>分野を選び、4択クイズに挑戦！問題は毎回ランダムに並びます。</p><label for="cat">出題する分野</label><select id="cat"><option value="all">全分野（全26問）</option><option>高血糖時の調節</option><option>低血糖時の調節</option><option>フィードバック</option><option>糖尿病</option></select><button class="primary" id="start">クイズを始める</button><p class="sub">※学習履歴や個人情報は保存されません。</p></div><div id="game" class="hide"><div class="tag" id="category"></div><div id="count" class="sub"></div><div class="progress"><div class="bar" id="bar"></div></div><div class="question" id="question"></div><div class="options" id="options"></div><div id="feedback" class="feedback hide" aria-live="polite"></div><div class="actions"><button class="primary hide" id="next">次の問題へ</button><button id="quit">最初に戻る</button></div></div><div id="end" class="hide"><h1>結果発表 🎉</h1><div id="score" class="stat"></div><p id="detail"></p><div class="actions"><button class="primary" id="retry">もう一度挑戦</button><button id="missed">間違えた問題だけ復習</button><button id="back">分野を選び直す</button></div></div></div></main><script>const BANK=[{"cat":"高血糖時の調節","q":"通常、血液100mL中の血糖は約何mg？","a":"100","opts":["10","50","100","500"],"explanation":"血液100 mL中の血糖量は、通常約100 mgに保たれています。"},{"cat":"高血糖時の調節","q":"血糖濃度の調節に関わる「＿＿神経系」は？","a":"自律","opts":["自律","中枢","体性","末梢"],"explanation":"自律神経系は、交感神経と副交感神経を通じて血糖濃度の調節に関わります。"},{"cat":"高血糖時の調節","q":"血糖濃度の調節に関わる「＿＿系」は？","a":"内分泌","opts":["内分泌","消化","循環","免疫"],"explanation":"内分泌系は、インスリンなどのホルモンの分泌によって血糖濃度を調節します。"},{"cat":"高血糖時の調節","q":"高血糖を感知して刺激される脳の部位は？","a":"視床下部","opts":["視床下部","大脳皮質","小脳","延髄"],"explanation":"血糖濃度が高くなると、視床下部が刺激されます。"},{"cat":"高血糖時の調節","q":"高血糖時、すい臓へ情報を伝えるのは何神経？","a":"副交感神経","opts":["副交感神経","交感神経","運動神経","感覚神経"],"explanation":"高血糖時には副交感神経を介して、すい臓のランゲルハンス島B細胞が刺激されます。"},{"cat":"高血糖時の調節","q":"高血糖時、ランゲルハンス島の何細胞が刺激される？","a":"B細胞","opts":["A細胞","B細胞","副腎皮質細胞","副腎髄質細胞"],"explanation":"ランゲルハンス島のB細胞は、高血糖時に刺激される細胞です。"},{"cat":"高血糖時の調節","q":"高血糖時、B細胞から分泌が促進されるホルモンは？","a":"インスリン","opts":["インスリン","グルカゴン","アドレナリン","糖質コルチコイド"],"explanation":"血糖濃度が高くなると視床下部が刺激され、副交感神経を通じてすい臓のランゲルハンス島B細胞が刺激されます。また、高血糖の血液もB細胞を直接刺激します。これによりインスリンの分泌が促進されます。"},{"cat":"高血糖時の調節","q":"インスリンが標的細胞で結合するのは？","a":"受容体","opts":["受容体","核","ミトコンドリア","リボソーム"],"explanation":"インスリンは標的細胞の受容体に結合して作用します。"},{"cat":"高血糖時の調節","q":"インスリンの作用により、細胞内で促進されるグルコースの利用（分解）を何という？","a":"消費","opts":["消費","排出","糖新生","再吸収"],"explanation":"インスリンは細胞へのグルコースの取り込みと、その消費（分解）を促進します。"},{"cat":"高血糖時の調節","q":"インスリンの標的器官で、グリコーゲンを合成するのは？","a":"肝臓","opts":["肝臓","腎臓","肺","胃"],"explanation":"肝臓では、インスリンの作用によりグルコースからグリコーゲンへの合成が促進されます。"},{"cat":"高血糖時の調節","q":"肝臓でグルコースから合成される物質は？","a":"グリコーゲン","opts":["グリコーゲン","デンプン","セルロース","タンパク質"],"explanation":"グリコーゲンは、グルコースが多数つながった貯蔵物質です。"},{"cat":"高血糖時の調節","q":"インスリンの作用によって血糖濃度はどうなる？","a":"低下する","opts":["低下する","上昇する","変化しない","必ずゼロになる"],"explanation":"インスリンはグルコースの取り込みやグリコーゲン合成を促進し、血糖濃度を低下させます。"},{"cat":"低血糖時の調節","q":"低血糖時、副腎髄質などへ情報を伝えるのは何神経？","a":"交感神経","opts":["交感神経","副交感神経","運動神経","感覚神経"],"explanation":"低血糖時には交感神経を介して、すい臓のA細胞や副腎髄質が刺激されます。"},{"cat":"低血糖時の調節","q":"低血糖時、ランゲルハンス島の何細胞が刺激される？","a":"A細胞","opts":["A細胞","B細胞","副腎皮質細胞","副腎髄質細胞"],"explanation":"ランゲルハンス島のA細胞は、低血糖時にグルカゴンを分泌します。"},{"cat":"低血糖時の調節","q":"副腎髄質から分泌され、血糖濃度を上げるホルモンは？","a":"アドレナリン","opts":["アドレナリン","インスリン","グルカゴン","糖質コルチコイド"],"explanation":"血糖濃度が低下すると視床下部が刺激され、交感神経を介して副腎髄質が刺激されます。その結果、アドレナリンの分泌が促進され、グリコーゲンの分解などを通じて血糖濃度を上昇させます。"},{"cat":"低血糖時の調節","q":"ランゲルハンス島A細胞から分泌されるホルモンは？","a":"グルカゴン","opts":["グルカゴン","インスリン","アドレナリン","糖質コルチコイド"],"explanation":"血糖濃度が低下すると視床下部が刺激され、交感神経を介してすい臓のランゲルハンス島A細胞が刺激されます。低血糖の血液もA細胞を直接刺激し、グルカゴンの分泌が促進されます。"},{"cat":"低血糖時の調節","q":"アドレナリンやグルカゴンにより分解が促進される物質は？","a":"グリコーゲン","opts":["グリコーゲン","デンプン","セルロース","タンパク質"],"explanation":"アドレナリンやグルカゴンは、肝臓などのグリコーゲンの分解を促進します。"},{"cat":"低血糖時の調節","q":"視床下部から分泌される「副腎皮質刺激ホルモン〇〇ホルモン」の〇〇は？","a":"放出","opts":["放出","抑制","分解","合成"],"explanation":"視床下部は副腎皮質刺激ホルモン放出ホルモンを分泌し、下垂体前葉を刺激します。"},{"cat":"低血糖時の調節","q":"副腎皮質刺激ホルモン放出ホルモンが刺激するのは？","a":"下垂体前葉","opts":["下垂体前葉","下垂体後葉","副腎皮質","甲状腺"],"explanation":"副腎皮質刺激ホルモン放出ホルモンは下垂体前葉に作用します。"},{"cat":"低血糖時の調節","q":"下垂体前葉から分泌され、副腎皮質を刺激するのは？","a":"副腎皮質刺激ホルモン","opts":["副腎皮質刺激ホルモン","甲状腺刺激ホルモン","成長ホルモン","バソプレシン"],"explanation":"血糖濃度が低下すると視床下部から副腎皮質刺激ホルモン放出ホルモンが分泌され、下垂体前葉を刺激します。その結果、下垂体前葉から副腎皮質刺激ホルモンが分泌され、副腎皮質を刺激します。"},{"cat":"低血糖時の調節","q":"副腎皮質から分泌される血糖上昇ホルモンは？","a":"糖質コルチコイド","opts":["糖質コルチコイド","アドレナリン","グルカゴン","インスリン"],"explanation":"血糖濃度が低下すると、視床下部から副腎皮質刺激ホルモン放出ホルモンが分泌され、下垂体前葉を刺激します。続いて下垂体前葉から副腎皮質刺激ホルモンが分泌され、副腎皮質を刺激します。その結果、糖質コルチコイドが分泌され、糖新生を促進して血糖濃度を上昇させます。"},{"cat":"低血糖時の調節","q":"糖質コルチコイドにより、グルコースの生成が促進される材料は？","a":"タンパク質","opts":["タンパク質","グリコーゲン","脂肪酸","デンプン"],"explanation":"糖質コルチコイドは、視床下部→下垂体前葉→副腎皮質というホルモンによる調節経路を経て分泌が促進されます。タンパク質からグルコースを生成する糖新生を促進します。"},{"cat":"フィードバック","q":"血糖濃度の調節に働くのは何のフィードバック？","a":"負","opts":["負","正","どちらも働かない","常に正のみ"],"explanation":"血糖濃度が上がれば下げ、下がれば上げる方向に調節する仕組みを負のフィードバックといいます。"},{"cat":"糖尿病","q":"インスリンの分泌量や反応性が低下し、慢性的に高血糖になる病気は？","a":"糖尿病","opts":["糖尿病","貧血","高血圧症","甲状腺機能亢進症"],"explanation":"糖尿病は、インスリンの分泌や作用が不十分になり、高血糖が慢性的に続く病気です。"},{"cat":"糖尿病","q":"自己免疫などでB細胞が破壊されるのは何型糖尿病？","a":"Ⅰ型","opts":["Ⅰ型","Ⅱ型","両方","どちらでもない"],"explanation":"Ⅰ型糖尿病では、自己免疫などによりB細胞が破壊され、インスリンの分泌が著しく不足します。"},{"cat":"糖尿病","q":"インスリンに対する標的細胞の反応性が低下することを特徴とする糖尿病は？","a":"Ⅱ型","opts":["Ⅰ型","Ⅱ型","尿崩症","低血糖症"],"explanation":"Ⅱ型糖尿病では、インスリンに対する細胞の反応性の低下（インスリン抵抗性）などがみられます。分泌低下も起こり得るため、それだけでⅠ型とは区別できません。"}];const $=id=>document.getElementById(id);let questions=[],mistakes=[],index=0,correct=0,answered=false;const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};function show(id){['home','game','end'].forEach(x=>$(x).classList.toggle('hide',x!==id))}function begin(list){questions=shuffle(list);mistakes=[];index=0;correct=0;show('game');render()}function render(){answered=false;const q=questions[index];$('category').textContent=q.cat;$('count').textContent=`${index+1} / ${questions.length} 問`;$('bar').style.width=`${100*index/questions.length}%`;$('question').textContent=q.q;$('feedback').classList.add('hide');$('next').classList.add('hide');$('options').replaceChildren();shuffle(q.opts).forEach(o=>{const b=document.createElement('button');b.className='opt';b.textContent=o;b.onclick=()=>choose(b,o);$('options').append(b)})}function choose(button,answer){if(answered)return;answered=true;const q=questions[index],ok=answer===q.a;if(ok)correct++;else mistakes.push(q);document.querySelectorAll('.opt').forEach(b=>{b.disabled=true;if(b.textContent===q.a)b.classList.add('correct');else if(b===button)b.classList.add('wrong')});$('feedback').replaceChildren();const verdict=document.createElement('div');verdict.textContent=ok?'⭕ 正解！':`❌ 不正解　正解：${q.a}`;const explanation=document.createElement('p');explanation.className='explanation';explanation.textContent='解説：'+q.explanation;$('feedback').append(verdict,explanation);$('feedback').classList.remove('hide');$('next').textContent=index===questions.length-1?'結果を見る':'次の問題へ';$('next').classList.remove('hide')}$('next').onclick=()=>{index++;if(index<questions.length)render();else finish()};function finish(){$('bar').style.width='100%';show('end');$('score').textContent=`${correct} / ${questions.length} 問正解`;$('detail').textContent=`正答率 ${Math.round(100*correct/questions.length)}％　｜　間違えた問題 ${mistakes.length} 問`;$('missed').disabled=mistakes.length===0}$('start').onclick=()=>begin(BANK.filter(q=>$('cat').value==='all'||q.cat===$('cat').value));$('retry').onclick=()=>begin(questions);$('missed').onclick=()=>begin(mistakes);$('quit').onclick=$('back').onclick=()=>show('home');</script></body></html>
